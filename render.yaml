services:
  - type: web
    name: bilim-jangi
    env: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: ADMIN_CHANNEL_URL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: START_PHOTO_URL
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: ADMIN_PANEL_USERNAME
        sync: false
      - key: ADMIN_PANEL_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bilim-jangi-db
          property: connectionString

databases:
  - name: bilim-jangi-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
