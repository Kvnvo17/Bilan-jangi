<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Turnir xonasi — Bilim Jangi</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="app duel-app">
        <header class="duel-header">
            <button class="back-btn" onclick="location.href='/tournament'">←</button>
            <div class="duel-title" id="tTitle">Turnir</div>
            <div class="coin-badge small">🪙 <span id="bCoin">0.00</span></div>
        </header>

        <div id="infoBox" class="mission-desc"></div>

        <div class="duel-mode-tabs">
            <button class="tab-btn active" data-tab="play" onclick="switchTab('play')">▶️ O'ynash</button>
            <button class="tab-btn" data-tab="board" onclick="switchTab('board')">🏆 Reyting</button>
        </div>

        <div id="playTab">
            <div id="questionCard" class="question-card">
                <div class="question-loading">Yuklanmoqda...</div>
            </div>
            <div id="resultBanner" class="result-banner hidden"></div>
            <button id="nextBtn" class="next-btn hidden" onclick="loadCurrentQuestion()">Keyingi savol →</button>
        </div>

        <div id="boardTab" class="hidden friends-list"></div>

        <button id="closeBtn" class="next-btn hidden" style="background:#DC2626; margin-top:14px" onclick="closeTournament()">🔒 Turnirni yopish</button>

        <div id="toast" class="toast"></div>
    </div>
    <script src="/static/js/tournament_room.js"></script>
</body>
</html>
