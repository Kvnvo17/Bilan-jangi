<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1v1 Duel — Bilim Jangi</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="app duel-app">
        <header class="duel-header">
            <button class="back-btn" onclick="location.href='/'">←</button>
            <div class="duel-title">🤖 Bot bilan Duel</div>
            <div class="coin-badge small">🪙 <span id="bCoin">0.00</span></div>
        </header>

        <div class="duel-mode-tabs">
            <button class="tab-btn active" id="tabBot">🤖 Bot bilan</button>
            <button class="tab-btn" id="tabHuman" onclick="location.href='/human-duel'">👤 Odam bilan</button>
        </div>

        <div id="questionCard" class="question-card">
            <div class="question-loading">Savol yuklanmoqda...</div>
        </div>

        <div id="resultBanner" class="result-banner hidden"></div>

        <button id="nextBtn" class="next-btn hidden" onclick="loadNextQuestion()">Keyingi savol →</button>

        <div id="toast" class="toast"></div>
    </div>

    <script src="/static/js/duel.js"></script>
</body>
</html>
