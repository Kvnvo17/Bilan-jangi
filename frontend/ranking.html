<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reyting — Bilim Jangi</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="app">
        <header class="duel-header">
            <button class="back-btn" onclick="location.href='/'">←</button>
            <div class="duel-title">🏆 Reyting</div>
        </header>

        <div class="duel-mode-tabs">
            <button class="tab-btn active" data-type="umumiy" onclick="loadRanking('umumiy')">Umumiy</button>
            <button class="tab-btn" data-type="1v1" onclick="loadRanking('1v1')">1v1</button>
            <button class="tab-btn" data-type="turnir" onclick="loadRanking('turnir')">Turnir</button>
        </div>

        <div id="rankingList" class="friends-list"></div>
        <div id="toast" class="toast"></div>
    </div>
    <script src="/static/js/ranking.js"></script>
</body>
</html>
