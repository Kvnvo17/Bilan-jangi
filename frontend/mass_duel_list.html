<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ommaviy Duel — Bilim Jangi</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="app">
        <header class="duel-header">
            <button class="back-btn" onclick="location.href='/'">←</button>
            <div class="duel-title">🌍 Ommaviy Duel</div>
        </header>

        <div class="question-card">
            <div class="question-text">➕ Yangi duel yaratish</div>
            <input type="text" id="duelNameInput" class="text-input" placeholder="Duel nomi">
            <button class="next-btn" onclick="createMassDuel()">🌍 Yaratish (max 50 kishi)</button>
            <button class="next-btn" id="adminCreateBtn" style="background:#7C3AED; display:none" onclick="createMassDuel(true)">
                👑 Admin duel yaratish (max 100 kishi)
            </button>
        </div>

        <div class="question-card" style="margin-top:14px">
            <div class="question-text">🔑 Kod orqali qo'shilish</div>
            <input type="text" id="joinCodeInput" class="text-input" placeholder="Duel kodi">
            <button class="next-btn" onclick="joinByCode()">Qo'shilish</button>
        </div>

        <h2 style="margin-top:20px; font-size:16px">🔥 Faol duellar</h2>
        <div id="duelsList" class="friends-list"></div>

        <div id="toast" class="toast"></div>
    </div>
    <script src="/static/js/mass_duel_list.js"></script>
</body>
</html>
